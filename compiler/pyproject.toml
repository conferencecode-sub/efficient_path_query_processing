[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recap-compiler"
version = "0.1.0"
description = "ReCAP path-query compiler: regex + selective aggregate + graph -> optimized recursive SQL."
requires-python = ">=3.10"
dependencies = [
    "duckdb",
    "pandas",
    "pyformlang",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
